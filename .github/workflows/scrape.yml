name: Scrape prices

on:
  schedule:
    - cron: '0 19 * * *' # daily, ~6am AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - name: Commit updated prices
        run: |
          if git diff --quiet public/data/boards.json; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "frostline-bot"
          git config user.email "frostline-bot@users.noreply.github.com"
          git add public/data/boards.json
          git commit -m "Update board prices $(date -u +%Y-%m-%d)"
          git push

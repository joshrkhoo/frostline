name: Scrape prices

on:
  schedule:
    - cron: '0 19 * * *' # daily, ~6am AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.rembg
          key: rembg-birefnet-general
      - run: pip install -r scraper/requirements.txt
      - name: Cut out new board photos
        run: python scraper/cutouts.py
      - name: Commit updated prices
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard public/cutouts)" ]; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "frostline-bot"
          git config user.email "frostline-bot@users.noreply.github.com"
          git add public/data/boards.json public/cutouts
          git commit -m "Update board prices $(date -u +%Y-%m-%d)"
          git push
